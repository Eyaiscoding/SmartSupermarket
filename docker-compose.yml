version: "3.9"

services:
  # -- Mosquitto MQTT Broker ---------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: b2g-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD", "timeout", "5", "sh", "-c", "echo > /dev/tcp/127.0.0.1/1883"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # -- TimescaleDB (PostgreSQL + Timescale extension) --------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: b2g-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: b2g
      POSTGRES_USER: b2g
      POSTGRES_PASSWORD: b2g_password
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2g -d b2g"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # -- Redis -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: b2g-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # -- FastAPI Backend ---------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2g-backend
    ports:
      - "8000:8000"
    environment:
      B2G_INGESTION_MODE: csv
      MQTT_BROKER_HOST: mosquitto
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      TIMESCALE_DB: b2g
      TIMESCALE_USER: b2g
      TIMESCALE_PASSWORD: b2g_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  timescale_data:
