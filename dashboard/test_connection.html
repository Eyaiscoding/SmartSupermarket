<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Connexion Backend</title>
    <style>
        body { font-family: system-ui; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .pending { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h1>🔍 Test de Connexion Backend B2G</h1>
    
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        
        async function testEndpoint(name, url, method = 'GET', body = null) {
            const div = document.createElement('div');
            div.className = 'test pending';
            div.textContent = `⏳ Test ${name}...`;
            results.appendChild(div);
            
            try {
                const options = { method };
                if (body) {
                    options.headers = { 'Content-Type': 'application/json' };
                    options.body = JSON.stringify(body);
                }
                
                const response = await fetch(url, options);
                const data = await response.json();
                
                div.className = 'test success';
                div.innerHTML = `✅ <strong>${name}</strong>: ${response.status}<br><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                div.className = 'test error';
                div.innerHTML = `❌ <strong>${name}</strong>: ${error.message}`;
            }
        }
        
        async function runTests() {
            await testEndpoint('Health Check', 'http://localhost:8000/health');
            await testEndpoint('Latest State', 'http://localhost:8000/api/v1/latest');
            await testEndpoint('Run Scenario (price_spike)', 'http://localhost:8000/api/v1/scenario', 'POST', { scenario: 'price_spike' });
        }
        
        runTests();
    </script>
</body>
</html>
