name: CI - Test, Lint, Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-lint-build:
    runs-on: ubuntu-latest

    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: b2g
          POSTGRES_USER: b2g
          POSTGRES_PASSWORD: b2g_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check src/ tests/ scenario_runner.py --select E,F,W --ignore E501

      - name: Run tests
        env:
          TIMESCALE_HOST: localhost
          TIMESCALE_PORT: "5432"
          TIMESCALE_DB: b2g
          TIMESCALE_USER: b2g
          TIMESCALE_PASSWORD: b2g_password
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Build Docker image
        run: |
          docker build -t b2g-backend:ci .
