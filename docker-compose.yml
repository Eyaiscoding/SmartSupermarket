services:
  # -- Zookeeper (Kafka coordination) ------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: b2g-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # -- Apache Kafka (Event Streaming) ------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: b2g-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # -- Mosquitto MQTT Broker ---------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: b2g-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t test -m test -q 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # -- TimescaleDB (PostgreSQL + Timescale extension) --------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: b2g-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: b2g
      POSTGRES_USER: b2g
      POSTGRES_PASSWORD: b2g_password
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2g -d b2g"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # -- Redis -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: b2g-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # -- FastAPI Backend ---------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2g-backend
    ports:
      - "8000:8000"
    environment:
      B2G_INGESTION_MODE: csv
      MQTT_BROKER_HOST: mosquitto
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      TIMESCALE_DB: b2g
      TIMESCALE_USER: b2g
      TIMESCALE_PASSWORD: b2g_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mosquitto:
        condition: service_healthy
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  timescale_data:
